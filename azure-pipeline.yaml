# Pipeline triggers on pushes to main branch (adjust as needed)
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Docker image name (ACR login server and repository)
  acrImageName: "<YOUR_ACR_NAME>.azurecr.io/loan-predictor"
  # Tag the image with the build ID (or use 'latest')
  imageTag: "$(Build.BuildId)"
  # Kubernetes namespace (use 'default' or your chosen namespace)
  k8sNamespace: "default"

stages:
- stage: Build
  displayName: "Build and Push Docker Image"
  jobs:
    - job: BuildJob
      displayName: "Build Docker image and push to ACR"
      steps:
        - checkout: self

        # Build and push the Docker image to ACR
        - task: Docker@2
          displayName: "Build and Push Docker Image"
          inputs:
            containerRegistry: "<ACR_Service_Connection_Name>"
            repository: "$(acrImageName)"
            command: "buildAndPush"
            dockerfile: "Dockerfile"
            tags: |
              $(imageTag)

- stage: Deploy
  displayName: "Deploy to AKS"
  dependsOn: Build
  jobs:
    - job: DeployJob
      displayName: "Deploy to AKS via Kubernetes Manifests"
      steps:
        - checkout: self

        # Apply Kubernetes manifests to AKS
        - task: KubernetesManifest@1
          displayName: "Deploy to AKS"
          inputs:
            action: "deploy"
            kubernetesServiceConnection: "<AKS_Service_Connection_Name>"
            namespace: "$(k8sNamespace)"
            manifests: |
              k8s/deployment.yaml
              k8s/service.yaml
            containers: |
              $(acrImageName):$(imageTag)
